<svg xmlns="http://www.w3.org/2000/svg" width="605" height="225" viewBox="0 0 605 225" fill="none">
  <style>
    .card {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), filter 0.25s;
      transform-box: fill-box;
      transform-origin: center;
    }
    .card:hover {
      transform: scale(1.05) translateY(-3px);
      filter: drop-shadow(0px 4px 8px rgba(43, 188, 138, 0.3));
    }
    .bg {
      fill: #1a1e24;
      stroke: #30363d;
      stroke-width: 1.5;
      rx: 8px;
      transition: stroke 0.25s, fill 0.25s;
    }
    .card:hover .bg {
      stroke: #2bbc8a;
      fill: #21262d;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 9px;
      fill: #8b949e;
      transition: fill 0.25s;
    }
    .card:hover .subtitle {
      fill: #c9d1d9;
    }
  </style>

  <!-- ROW 0 -->
  <g class="card" transform="translate(10, 10)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Python</text>
    <text class="subtitle" x="50" y="40">Data Science &amp; ML</text>
  </g>

  <g class="card" transform="translate(160, 10)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original-wordmark.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">MySQL / SQL</text>
    <text class="subtitle" x="50" y="40">Querying &amp; RDBMS</text>
  </g>

  <g class="card" transform="translate(310, 10)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Java</text>
    <text class="subtitle" x="50" y="40">Production Apps</text>
  </g>

  <g class="card" transform="translate(460, 10)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/fastapi/fastapi-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">FastAPI</text>
    <text class="subtitle" x="50" y="40">High Performance APIs</text>
  </g>

  <!-- ROW 1 -->
  <g class="card" transform="translate(10, 80)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/django/django-plain.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Django</text>
    <text class="subtitle" x="50" y="40">Web Framework</text>
  </g>

  <g class="card" transform="translate(160, 80)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/pandas/pandas-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Pandas</text>
    <text class="subtitle" x="50" y="40">Data Manipulation</text>
  </g>

  <g class="card" transform="translate(310, 80)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/scikitlearn/scikitlearn-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Scikit-Learn</text>
    <text class="subtitle" x="50" y="40">Machine Learning</text>
  </g>

  <g class="card" transform="translate(460, 80)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/numpy/numpy-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">NumPy</text>
    <text class="subtitle" x="50" y="40">Scientific Computing</text>
  </g>

  <!-- ROW 2 -->
  <g class="card" transform="translate(10, 150)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/matplotlib/matplotlib-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Matplotlib</text>
    <text class="subtitle" x="50" y="40">Data Visualization</text>
  </g>

  <g class="card" transform="translate(160, 150)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/amazonwebservices/amazonwebservices-original-wordmark.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">AWS</text>
    <text class="subtitle" x="50" y="40">Cloud Infrastructure</text>
  </g>

  <g class="card" transform="translate(310, 150)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Git</text>
    <text class="subtitle" x="50" y="40">Version Control</text>
  </g>

  <g class="card" transform="translate(460, 150)">
    <rect class="bg" width="135" height="55" />
    <image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jenkins/jenkins-original.svg" x="10" y="12" width="30" height="30" />
    <text class="title" x="50" y="26">Jenkins</text>
    <text class="subtitle" x="50" y="40">CI/CD &amp; Automation</text>
  </g>
</svg>
